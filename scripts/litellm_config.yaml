# LiteLLM proxy config: translate Anthropic-format requests to local Ollama
model_list:
  - model_name: qwen3:8b
    litellm_params:
      model: ollama_chat/qwen3:8b
      api_base: http://localhost:11434

litellm_settings:
  drop_params: true   # drop params the backend does not support instead of erroring
